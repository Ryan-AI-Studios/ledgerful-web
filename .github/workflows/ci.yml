name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekday mid-morning US East — off-hour minute to avoid top-of-hour herd.
  # GitHub schedules use the cron + optional timezone (not UTC-only).
  schedule:
    - cron: "27 10 * * 1-5"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test launch truth verdicts
        run: npm run test:launch-truth

      - name: Build
        run: npm run build

      - name: Check quiet preview and public truth
        env:
          LAUNCH_TRUTH_LIVE: "0"
        run: npm run check:truth

      - name: Check dependency provenance
        run: npm run check:provenance

      - name: Verify build leaves tracked sources clean
        run: git diff --exit-code

  # Live publication drift — NOT a required PR check (GLM-review).
  # Runs on push to main, weekday schedule, and manual dispatch.
  # Exit taxonomy from scripts/check-launch-truth.mjs:
  #   0 = match, 1 = DRIFT, 2 = UNVERIFIED (transport), 3 = STALE.
  launch-truth-drift:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check launch truth against live published state
        run: |
          unset LAUNCH_TRUTH_API_BASE
          code=0
          npm run check:launch-truth:live || code=$?
          node scripts/report-launch-truth-status.mjs "$code"

  test-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check:links

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test production browser behavior
        run: npm run test:e2e:run

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
